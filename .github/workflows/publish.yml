name: Publish

# RUNS WHEN THE DATA CHANGES, NOT ON A CLOCK.
#
# There is no `schedule:` here, and that is a decision rather than an omission.
# Three reasons:
#
#   1. The exporter's output is deterministic — the same database produces the
#      same bytes. A nightly cron would redeploy identical content on 364 days
#      out of every 365.
#   2. The data only changes when a fetch/scan/probe run happens, and those run
#      by hand on the machine that holds the database. The real event is
#      "data/ changed", so that is the trigger.
#   3. A cron would make the dataset LOOK freshly updated while every date in
#      `probeCheckedAt` stayed exactly the same. This dataset sells precisely
#      "the day we asked" — blurring that destroys the only thing it has.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A later deploy supersedes an earlier one, but an in-flight deploy is not
# cancelled — interrupting one can leave Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Prove determinism BEFORE building for real: build twice in-process and
      # compare sha256. If a timestamp or filesystem ordering ever leaks in, it
      # dies here rather than by silently producing a deploy that differs from
      # the last one for reasons nobody can explain.
      - name: Check determinism
        run: node scripts/build-dist.mjs --check

      # The build itself also enforces two invariants and exits non-zero if
      # either breaks:
      #   - `servers/{name}.json` matches the real file path
      #   - the root of dist/ holds no files (that space belongs to skills/,
      #     which lives in a different repo)
      - name: Build dist
        run: node scripts/build-dist.mjs

      # Runs AFTER the build on purpose: the string that actually reached
      # consumers last time was generated into dist/findings/index.json, not
      # written in a source file. Checking only the sources would have missed it.
      - name: Check the public surface is in English
        run: node scripts/check-language.mjs

      # The index carries two sources now, so the identity has two terms:
      # scanned records (what the exporter manifest counts) plus vendor
      # submissions under registry/. Checking only the first term is what failed
      # on the commit that introduced submissions — correctly, which is the point
      # of having the gate.
      - name: Cross-check the record count against its two sources
        run: |
          scanned=$(jq -r '.servers' data/export-manifest.json)
          submitted=$(find registry -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          actual=$(jq 'length' dist/mcp/index.json)
          echo "scanned=$scanned submitted=$submitted index=$actual"
          if [ "$actual" != "$((scanned + submitted))" ]; then
            echo "::error::mcp/index.json holds $actual records; $scanned scanned + $submitted submitted = $((scanned + submitted))"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # "DID THIS EVER DEPLOY?" — TWO API FIELDS THAT LOOK LIKE NO, AND MEAN NOTHING
  #
  # `gh api repos/TracyHQ/mcp/pages` returns `status: null`, and
  # `.../pages/builds/latest` returns 404. Both look exactly like a site that has
  # never published. Neither is a failure signal: `builds/latest` belongs to
  # branch-built Pages, which workflow-built sites never populate, and the same
  # two responses come back from TracyHQ/skills while it is serving fine.
  #
  # The endpoint that actually answers is `repos/{owner}/{repo}/deployments` —
  # look for environment `github-pages` and check its sha.
  #
  # Written here rather than in an ADR because this is where someone stands when
  # they ask the question. It cost one round of misdiagnosis on 2026-08-03.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
