name: validate
on:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Submissions. Pure rules only — no call reaches a vendor's endpoint from
      # CI. Whether the server actually answers is the prober's job, on its own
      # schedule and in its own sandbox (ADR 0018 §2).
      # The committed schema must match what src/record.ts generates. Otherwise
      # a submitter validates against one contract while CI enforces another,
      # and they only find out after opening a pull request.
      - name: Schema has not drifted from src/record.ts
        run: |
          pnpm emit-schema
          git diff --exit-code schema/ || {
            echo "::error::schema/ is out of date. Run 'pnpm emit-schema' and commit the result."
            exit 1
          }

      - run: pnpm validate
      # Descriptions are derived from _meta evidence and committed into data/;
      # a record whose evidence moved without its description is stale prose
      # about measurements that no longer say that.
      - run: node scripts/derive-descriptions.mjs --check
      - run: pnpm build-dist
      # After the build on purpose: the strings that reach consumers are
      # generated into dist/, not written in a source file.
      - run: pnpm check-language
